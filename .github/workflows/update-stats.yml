name: Update CR7 Live Stats

# 兜底巡检：更新仓库内的静态快照 data/live-stats.json
#
# 主链路已经迁到 Cloudflare（Worker + Cron Triggers 每 6 小时抓取，写入 KV）。
# 这里降级为每天一次，只负责把仓库里的静态快照刷新到最新，
# 作为前端三级回退里的第二级（/api/cr7-stats 挂掉时仍能拿到较新的数据）。
#
# 注意：GitHub 会在仓库连续 60 天无活动后自动停用 schedule 事件。
# 即使本工作流被停用，Cloudflare 侧的实时数据依然正常，不会像以前那样整体失效。

on:
  schedule:
    - cron: "0 3 * * *"   # 每天 UTC 03:00 = 北京时间 11:00
  workflow_dispatch:
    inputs:
      force:
        description: "忽略「生涯累计只增不减」校验（仅在数据确实需要下调时勾选）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-cr7-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取最新数据
        id: fetch
        run: |
          # 抓取脚本只依赖标准库，无需 pip install（少一层网络失败风险）
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/fetch-stats.py --quiet --force
          else
            python scripts/fetch-stats.py --quiet
          fi

      - name: 显示当前数据
        run: cat data/live-stats.json

      - name: 检测数据变化
        id: diff
        run: |
          if git diff --quiet -- data/live-stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "数据已更新，准备提交"
          fi

      - name: 提交并推送更新
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/live-stats.json
          git commit -m "chore(data): 自动更新 C 罗生涯数据快照 [skip ci]"
          git push
