name: Update CR7 Live Stats

# 定时更新 C 罗进球数据
# 每天 UTC 00:00 / 06:00 / 12:00 / 18:00 运行（北京时间 08:00 / 14:00 / 20:00 / 02:00）
# 比赛日可通过 workflow_dispatch 手动触发即时更新

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发原因（可选）"
        required: false
        default: "手动刷新数据"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 抓取最新数据
        id: fetch
        run: |
          python scripts/fetch-stats.py
          echo "--- 当前 live-stats.json 内容 ---"
          cat data/live-stats.json

      - name: 检测数据变化
        id: diff
        run: |
          if git diff --quiet -- data/live-stats.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "数据无变化，跳过提交"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "数据已更新，准备提交"
          fi

      - name: 提交并推送更新
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/live-stats.json
          git commit -m "chore(data): 自动更新 C 罗实时数据 [skip ci]"
          git push
