name = "cr7-tribute-stats"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# 定时抓取：每 6 小时一次（UTC 00:00 / 06:00 / 12:00 / 18:00，即北京时间 08/14/20/02 点）
# Cloudflare 的 Cron Triggers 不会像 GitHub Actions 那样因仓库无活动而被停用。
[triggers]
crons = ["0 0,6,12,18 * * *"]

# 抓取结果存放的 KV 命名空间。
# 首次部署前先执行：npx wrangler kv namespace create STATS_KV
# 把返回的 id 填到下面（预览环境可用 preview_id）。
[[kv_namespaces]]
binding = "STATS_KV"
id = "f381b7451ea74fedb871196b906e4540"

[observability]
enabled = true

[vars]
# 生产环境建议改成站点域名，避免被别的站点盗用接口
ALLOWED_ORIGIN = "*"

# 手动强制刷新用的口令，部署后用 npx wrangler secret put REFRESH_TOKEN 设置（不要写在这里）
# REFRESH_TOKEN = ""
